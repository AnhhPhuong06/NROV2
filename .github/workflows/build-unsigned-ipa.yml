name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out project and Unity libraries
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: HuyenThoaiBoy-unsigned-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics-${{ github.run_number }}
          path: |
            build/xcodebuild.log
            build/Build.xcresult
          if-no-files-found: ignore
          retention-days: 7
